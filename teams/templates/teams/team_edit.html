{% extends 'home/base.html' %}

{% block title %}Редактировать команду - StatVolley{% endblock %}

{% block content %}
<div class="mb-3">
    <a href="{% url 'teams:detail' team.id %}" class="btn btn-outline-secondary btn-sm">&larr; Отмена</a>
</div>

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="p-4 bg-body-tertiary rounded-3 border">
            <h3>Редактировать команду</h3>
            <form method="post" class="mt-3">
                {% csrf_token %}
                <div class="mb-3">
                    {{ form.name.label_tag }}
                    {{ form.name }}
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-success flex-grow-1">Сохранить</button>
                    <a href="{% url 'teams:detail' team.id %}" class="btn btn-outline-secondary">Отмена</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
